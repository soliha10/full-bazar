services:
  - type: web
    name: full-bazar-api
    # Render'dagi servis Docker runtime'ida turibdi. Bu yerda `python` deb
    # yozilgani uchun ikkisi bir-biriga to'g'ri kelmasdi va deploy
    # "failed to read dockerfile" bilan uzilardi.
    runtime: docker
    rootDir: python/fastapi_app
    # Yo'llar rootDir ga nisbatan
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # buildCommand / startCommand Docker runtime'da ishlatilmaydi —
    # o'rnatish va ishga tushirish Dockerfile ichida.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FEEDBACK_CHAT_ID
        sync: false
      - key: MODEL_PATH
        value: ""
    plan: free
