name: Scrape & Sync to Supabase

on:
  schedule:
    # Kuniga 4 marta: 00:00, 06:00, 12:00, 18:00 (UTC) = 05:00, 11:00, 17:00, 23:00 (Toshkent)
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Qo'lda ham ishga tushirish mumkin

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Yig'ish 15 daqiqa, sinxronizatsiya esa sirsiz baribir yiqiladi.
      # 2026-09-28 dan 2026-10-05 gacha har ish aynan shunday behuda ketdi:
      # SUPABASE_DB_URL bo'sh qiymat bilan qayta yozilgan edi, bu esa faqat
      # oxirgi qadamda, "socket topilmadi" degan chalg'ituvchi xato bo'lib
      # ko'rinardi. Endi birinchi soniyada aytiladi.
      - name: Tekshirish — SUPABASE_DB_URL siri bor va bo'sh emasmi
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DB_URL//[[:space:]]/}" ]; then
            echo "::error::SUPABASE_DB_URL siri bo'sh yoki o'rnatilmagan."
            echo "Settings → Secrets and variables → Actions → SUPABASE_DB_URL"
            echo "ni Supabase connection string i bilan qayta yozing, masalan:"
            echo "  postgresql://postgres.<ref>:<parol>@aws-0-<region>.pooler.supabase.com:5432/postgres"
            exit 1
          fi
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL postgresql:// bilan boshlanmaydi."
               exit 1 ;;
          esac
          echo "SUPABASE_DB_URL o'rnatilgan (${#DB_URL} belgi)."

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scraper dependencies
        run: |
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.2.2 psycopg2-binary==2.9.9

      # Ulanishni yig'ishdan OLDIN tekshiramiz. 2026-10-05 dan 2026-10-09 gacha
      # har ish 15 daqiqa yig'ib, faqat oxirida "password authentication
      # failed" bilan yiqilardi. Endi bunday xato birinchi daqiqada chiqadi.
      - name: Tekshirish — Supabase ga ulanish
        env:
          PRODUCTS_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python python/sync_csv.py --check-db

      # curl_cffi Chrome ning TLS barmoq izini takrorlaydi — Cloudflare ortidagi
      # asaxiy va olcha runner IP laridan kelgan oddiy `requests` so'rovini 403
      # bilan rad etardi. Bu ixtiyoriy: scrapers/base.py uni topolmasa,
      # avvalgidek `requests` bilan ishlayveradi, shuning uchun g'ildirak
      # yig'ilmay qolsa ish to'xtamaydi.
      - name: Install curl_cffi (ixtiyoriy — Cloudflare uchun)
        continue-on-error: true
        run: pip install "curl_cffi>=0.7,<0.8"

      # Mantiq python/run_scrapers.py da: 0 mahsulot bergan do'kon endi 'OK'
      # emas, 'FAIL' deb belgilanadi va Actions sahifasida ogohlantirish
      # ko'rinadi. Ish baribir davom etadi — qolgan do'konlarning yangi
      # narxlari sinxronizatsiyaga tushishi kerak.
      - name: Run all scrapers
        run: python python/run_scrapers.py --output ./data --delay 0.5

      # DIQQAT: to'rtta do'kon bu yerda yig'ilmaydi, chunki runner IP laridan
      # ularga kirib bo'lmaydi. Narxlari repodagi CSV dan olinadi, CSV esa
      # MAHALLIY yangilanadi:
      #
      #   ozon                       python python/scrape_ozon_local.py
      #   asaxiy · olcha · chakana   python python/run_scrapers.py --local \
      #                                  --output ./data --delay 1.5
      #
      # Sabablari: scrapers/ozon.py va scrapers/__init__.py boshidagi izohlar.
      # Har CSV yonida `.meta` (yig'ilgan sana) turadi — fayl eskirib qolsa
      # sync uni butunlay o'tkazib yuboradi (MAX_CSV_AGE_DAYS), shuning uchun
      # eski narx saytda yangidek ko'rinmaydi.
      - name: Sync CSV data to Supabase
        env:
          PRODUCTS_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATA_DIR: ./data
        run: |
          python python/sync_csv.py

      # Sitemap `npm run build` paytida yaratiladi (frontend/scripts/seo-postbuild.mjs).
      # Mahsulotlar esa kuniga 4 marta yangilanadi: deploy qilinmasa sitemap
      # eskirib qoladi — Google'ga allaqachon o'chirilgan mahsulot manzillari
      # ko'rsatiladi (ular 404 qaytaradi) va yangilari umuman tushmaydi.
      # Shuning uchun sinxronizatsiyadan keyin Netlify build'ini turtamiz.
      #
      # NETLIFY_BUILD_HOOK — Netlify: Site settings → Build & deploy →
      # Build hooks dan olinadigan URL. Sir qo'yilmagan bo'lsa qadam
      # jimgina o'tkazib yuboriladi, ish muvaffaqiyatsiz bo'lmaydi.
      - name: Rebuild frontend (sitemap yangilanishi uchun)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK sozlanmagan — sitemap eski holicha qoladi"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST -d '{}' "$HOOK")
          echo "Netlify build hook: HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "201" ]

      - name: Report results
        run: |
          echo "Scrape & Sync completed at $(date)"
