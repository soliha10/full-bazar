name: Deploy to VPS

# main ga har push da Contabo serverga chiqaradi (deploy/deploy.sh). Skript
# faqat o'zgargan qismni quradi: data/ commit lari sayt build ini boshlamaydi.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ketma-ket push larda deploy lar bir-birini kutadi, uzilib qolmaydi
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH orqali deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes root@"$HOST" /opt/full-bazar/deploy/deploy.sh
