name: Scrape specs to Supabase

# Texnik xususiyatlar (ekran, protsessor, batareya...) GSMArena dan yig'iladi va
# product_specs jadvaliga yoziladi. Solishtirish sahifasi va mahsulot
# sahifasidagi "Xususiyatlar" bo'limi shundan oziqlanadi.
#
# Narx yig'adigan scrape_and_sync.yml dan ALOHIDA turadi, chunki:
#   · specs tez-tez o'zgarmaydi — haftada bir marta yetarli
#   · GSMArena ga nisbatan odobli bo'lish kerak (so'rovlar orasida kutish)
#   · uzoqroq davom etadi va narx yangilanishini kechiktirmasligi kerak
#
# Uch qadam: EKSPORT -> SCRAPE -> SYNC.
#   · eksport: bazadagi mavjud yozuvlar CSV ga qaytariladi
#   · scrape:  brendlarning ro'yxat sahifalari (LIST byudjeti doirasida,
#              ustuvor brendlardan boshlab), so'ng model sahifalari (DETAIL
#              byudjeti). Ikkala byudjet ham timeout-minutes ichiga sig'ishi shart
#   · sync:    CSV bazaga yoziladi + qamrov hisoboti
# Eksport tufayli o'tgan haftalarda olingan model sahifalari qayta
# yuklanmaydi — tafsilot qamrovi har ish bilan o'sib boradi.

on:
  schedule:
    # Har yakshanba 03:00 UTC = 08:00 Toshkent
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      list_budget:
        description: "Ro'yxat sahifalariga sarflanadigan vaqt (sekund)"
        required: false
        default: '1500'
      detail_budget:
        description: 'Model sahifalariga sarflanadigan vaqt (sekund)'
        required: false
        default: '2400'

concurrency:
  group: scrape-specs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    # Ikki byudjet (1500 + 2400 = 65 daqiqa) + o'rnatish/sync uchun zaxira.
    # Byudjetlarni oshirsangiz shu qiymatni ham oshiring — timeout qadamni
    # o'ldiradi va sync ishlamay qoladi.
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.2.2 psycopg2-binary==2.9.9

      # Bazadagi yozuvlarni CSV ga qaytaramiz — scraper ularni qayta yuklamaydi
      - name: Export existing specs from Supabase
        env:
          PRODUCTS_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATA_DIR: ./data
        run: |
          mkdir -p ./data
          python python/sync_specs.py --export

      - name: Scrape specs from GSMArena
        working-directory: python
        env:
          GSMARENA_LIST_BUDGET: ${{ github.event.inputs.list_budget || '1500' }}
          GSMARENA_DETAIL_BUDGET: ${{ github.event.inputs.detail_budget || '2400' }}
        run: |
          mkdir -p ../data
          python -c "
          import sys, logging
          sys.path.insert(0, '.')
          logging.basicConfig(level=logging.INFO, format='%(message)s')
          from scrapers import GsmarenaSpecsScraper
          n = GsmarenaSpecsScraper(output_dir='../data', delay=1.2).run()
          print(f'=== {n} ta model yig\'ildi ===')
          if n == 0:
              sys.exit('specs yig\'ilmadi — sayt tuzilmasi o\'zgargan bo\'lishi mumkin')
          "

      - name: Sync specs to Supabase
        env:
          PRODUCTS_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATA_DIR: ./data
        run: python python/sync_specs.py
