name: Sync specs to Supabase

# Texnik xususiyatlar (ekran, protsessor, batareya, kamera...) product_specs
# jadvaliga yoziladi. Solishtirish sahifasi va mahsulot sahifasidagi
# "Xususiyatlar" bo'limi shundan oziqlanadi.
#
# ── Nega bu ish endi HECH NARSA YIG'MAYDI ─────────────────────────────────────
# GSMArena GitHub Actions IP larini agressiv cheklaydi. 2026-09-13 dagi ish
# (run 34746104533) buni aniq ko'rsatdi:
#   · 126 brenddan 10 tasi o'qildi, ulardan faqat Samsung natija berdi —
#     Xiaomi, Apple, Honor, Infinix, Tecno, Realme, Oppo, vivo, Huawei: 0 ta
#   · model sahifalari: 1564 tadan 15 tasi (qolgani 429) → kamera, zaryadlash,
#     OS ustunlari butunlay bo'sh qoldi
#   · 65 daqiqalik byudjetning katta qismi 429 dan keyingi kutishlarga ketdi
# O'sha URL lar oddiy uy/ofis internetidan 200 qaytaradi. Ya'ni muammo kodda
# emas, IP da — byudjetni oshirish yordam bermaydi.
#
# Shuning uchun yig'ish MAHALLIY bajariladi:
#     python python/scrape_specs_local.py            # data/gsmarena_specs.csv
#     git add data/gsmarena_specs.csv && git commit  # natija repoga tushadi
# Bu ish esa faqat commit qilingan CSV ni Supabase ga yozadi — bir necha
# soniya, cheklovsiz, tushib qolmaydi.
#
# sync_specs.py dagi UPSERT bo'sh qiymat bilan bazadagi tayyor tafsilotni
# o'chirmaydi, shuning uchun CSV chala bo'lsa ham xavfsiz.

on:
  push:
    branches: [main]
    paths:
      - 'data/gsmarena_specs.csv'
      - 'python/sync_specs.py'
      - '.github/workflows/scrape_specs.yml'
  schedule:
    # Har yakshanba 03:00 UTC = 08:00 Toshkent — CSV o'zgarmagan bo'lsa ham
    # qamrov hisobotini beradi va yangi mahsulotlarga moslikni tekshiradi.
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: sync-specs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Sir bo'sh bo'lsa sync_specs.py birinchi qadamda to'xtaydi, lekin
      # sababini bu yerda aytish arzonroq va aniqroq.
      - name: Tekshirish — SUPABASE_DB_URL siri bor va bo'sh emasmi
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${DB_URL//[[:space:]]/}" ]; then
            echo "::error::SUPABASE_DB_URL siri bo'sh yoki o'rnatilmagan."
            echo "Settings → Secrets and variables → Actions da uni qayta yozing."
            exit 1
          fi
          echo "SUPABASE_DB_URL o'rnatilgan (${#DB_URL} belgi)."

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install psycopg2-binary==2.9.9

      - name: Sync specs to Supabase
        env:
          PRODUCTS_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATA_DIR: ./data
        run: python python/sync_specs.py
