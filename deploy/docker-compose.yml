# Contabo VPS dagi butun tizim: Postgres + FastAPI + Caddy (HTTPS, statik sayt).
#
#   cd /opt/full-bazar/deploy && docker compose up -d --build
#
# Sirlar deploy/.env da (gitignore da; namuna — .env.example). Sayt fayllari
# /var/www/bazarcom da — deploy.sh frontend/build ni o'sha yerga ko'chiradi.

name: bazar

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullbazar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env da POSTGRES_PASSWORD yo'q}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../python/init_db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Faqat serverning o'zidan (SSH tunnel orqali) — internetga ochilmaydi
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fullbazar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qidiruv (python/fastapi_app/search_es.py). Faqat ichki tarmoqda — port
  # ochilmagan, shuning uchun xavfsizlik (parol) o'chiq. Indeksni API o'zi
  # bazadan quradi; ES ishlamasa qidiruv Postgres ga o'tadi, sayt to'xtamaydi.
  # 512 MB heap bilan konteyner ~1 GB ishlatadi (mahalliy o'lchov, 2026-11-12).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Katalog kichik (~2 ming hujjat) — mmap shart emas, vm.max_map_count ni
      # serverda o'zgartirmaslik uchun o'chiq
      node.store.allow_mmap: "false"
      ingest.geoip.downloader.enabled: "false"
    mem_limit: 1280m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: ../python/fastapi_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fullbazar
      JWT_SECRET: ${JWT_SECRET:?deploy/.env da JWT_SECRET yo'q}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FEEDBACK_CHAT_ID: ${FEEDBACK_CHAT_ID:-}
      # Ro'yxatdan o'tish kodlari (python/fastapi_app/otp.py). Kalit bo'sh bo'lsa
      # o'sha kanal o'chiq: email kodsiz ishlaydi, telefon varianti ko'rinmaydi.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bazarcom <noreply@bazarcom.online>}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      ESKIZ_TEMPLATE: ${ESKIZ_TEMPLATE:-}
      # Dagster dagi matcher_oqitish yozadi; fayl yangilansa API o'zi qayta yuklaydi
      MODEL_PATH: /models/best_matcher.pkl
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_INDEX: /srv/site/index.html
      PORT: "10000"
    volumes:
      - /var/www/bazarcom:/srv/site:ro
      - /var/lib/bazar/data/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_IP: ${SERVER_IP:-185.174.255.157}
      # dagster./mlflow. panellari paroli (bcrypt; `caddy hash-password`)
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:?deploy/.env da PANEL_PASSWORD_HASH yo'q}
    volumes:
      # Papka butunligicha: git yangi Caddyfile yozganda bitta fayl mount i
      # eski inode da qolib ketardi va `caddy reload` o'zgarishni ko'rmasdi
      - ./caddy:/etc/caddy:ro
      - /var/www/bazarcom:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── Dagster: narxlarni jadval bo'yicha yig'ish (deploy/dagster/definitions.py)
  dagster-webserver:
    build: ./dagster
    image: bazar-dagster
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /repo/deploy/dagster/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
    environment: &dagster-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCTS_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fullbazar
      DATA_DIR: /data
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TZ: Asia/Tashkent
    # IPv6 nima uchun o'chirilgani — pastda, jobs xizmatida
    sysctls: &no-ipv6
      net.ipv6.conf.all.disable_ipv6: 1
    volumes: &dagster-volumes
      - ..:/repo:ro
      - /var/lib/bazar/data:/data

  # Jadvalni kuzatadi va run larni ishga tushiradi — op lar shu konteynerda ishlaydi
  dagster-daemon:
    build: ./dagster
    image: bazar-dagster
    restart: unless-stopped
    command: dagster-daemon run -w /repo/deploy/dagster/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
    environment: *dagster-env
    sysctls: *no-ipv6
    volumes: *dagster-volumes

  # ── MLflow: matcher o'qitish natijalari (train_matcher.py yozadi)
  mlflow:
    build: ./dagster
    image: bazar-dagster
    restart: unless-stopped
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mlartifacts:/mlartifacts

  # Skreyper + sinxronizatsiya, qo'lda yoki deploy.sh dan (deploy/scrape.sh):
  # docker compose --profile jobs run --rm jobs ... Jadval bo'yicha — Dagster.
  jobs:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: jobs.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRODUCTS_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fullbazar
      DATA_DIR: /data
    # Docker tarmog'ida IPv6 yo'q, Cloudflare ortidagi do'konlar (texnomart)
    # esa AAAA ham beradi — curl IPv6 ni tanlasa "0 ms da ulanmadi" bo'lardi
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    working_dir: /repo
    volumes:
      # Kod faqat o'qish uchun; CSV lar repodan tashqarida turadi — deploy dagi
      # `git reset --hard` yangi yig'ilgan narxlarni eskisi bilan almashtirmasin
      - ..:/repo:ro
      - /var/lib/bazar/data:/data

volumes:
  pgdata:
  esdata:
  caddy_data:
  caddy_config:
  mlartifacts:
